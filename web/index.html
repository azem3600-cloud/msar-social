<style>

.cal .d{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--card);cursor:pointer;overflow:hidden}.cal .d.o{opacity:.35}.cal .d.t{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.cal .d.s{background:var(--soft)}

.more{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.more button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:600}.more b{font-size:26px}
