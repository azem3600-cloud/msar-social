<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسار — الجدولة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#159FC6">
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="card" hidden>
  <h3>مسار — الجدولة</h3>
  <label>الإيميل</label><input id="em" type="email" autocomplete="username">
  <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="p" id="go">دخول</button></p><p class="muted" id="lerr"></p>
</div>
<div id="app" hidden>
  <header><b>مسار — الجدولة</b><button class="s" id="out">خروج</button></header>
  <nav id="tabs">
    <button data-t="sched" class="on">الجدول</button><button data-t="new">منشور جديد</button>
    <button data-t="inbox">الوارد <span id="unread"></span></button><button data-t="accts">المنصات</button>
  </nav>
  <main id="view"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
